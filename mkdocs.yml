site_name: BehaviorScope-X
site_description: GUI and reproducible workflows for pose-assisted animal behavior classification.
site_url: https://farhanaugustine.github.io/BehaviorScope-X/
repo_url: https://github.com/farhanaugustine/BehaviorScope-X
repo_name: farhanaugustine/BehaviorScope-X
edit_uri: ""

theme:
  name: material
  language: en
  logo: assets/behaviorscope-x-mark.svg
  favicon: assets/behaviorscope-x-mark.svg
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/circle-half-full
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: teal
      toggle:
        icon: material/circle-half-full
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

nav:
  - Home: index.md
  - Start Here:
      - Documentation Overview: documentation.md
      - Installation: installation.md
      - GUI Overview: gui-overview.md
      - Citation: citation.md
      - Acknowledgments: acknowledgments.md
  - Curate Data:
      - Annotation Workflow: annotation-workflow.md
  - Model Workflows:
      - YOLO-pose: yolo-pose-workflow.md
      - MobileNetV3: mobilenetv3-workflow.md
      - DeepLabCut-HRNet: deeplabcut-hrnet-workflow.md
      - Feature Taps: feature-taps.md
  - Review Results:
      - Outputs and Provenance: outputs-and-provenance.md
      - Troubleshooting: troubleshooting.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: "#"
      permalink_title: Link to this section
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

extra_css:
  - stylesheets/extra.css
  - stylesheets/landing-fixes.css
  - stylesheets/navigation-contrast.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/farhanaugustine/BehaviorScope-X
